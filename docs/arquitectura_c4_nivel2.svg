  <text x="80" y="136" text-anchor="middle" fill="#444" font-size="9">venta_tiendas</text>
  <text x="80" y="148" text-anchor="middle" fill="#888" font-size="8">&gt;10M filas</text>

  <!-- CSV Ecom -->
  <rect x="30" y="174" width="100" height="56" fill="white" rx="6" filter="url(#shadow)" stroke="#2E6DA4" stroke-width="1.2"/>
