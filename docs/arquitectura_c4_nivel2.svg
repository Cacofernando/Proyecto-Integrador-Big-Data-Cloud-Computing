  <text x="347" y="154" text-anchor="middle" fill="#555" font-size="8">Sin transformaciones</text>
  <text x="347" y="168" text-anchor="middle" fill="#555" font-size="8">Time Travel ✓</text>
  <text x="347" y="182" text-anchor="middle" fill="#888" font-size="8">ACID · Schema evol.</text>

