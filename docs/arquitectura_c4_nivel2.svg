  <text x="482" y="154" text-anchor="middle" fill="#555" font-size="8">partitionBy(anio,mes)</text>
  <text x="482" y="168" text-anchor="middle" fill="#555" font-size="8">7 transformaciones</text>
  <text x="482" y="182" text-anchor="middle" fill="#555" font-size="8">Calidad + dedup</text>
  <text x="482" y="196" text-anchor="middle" fill="#888" font-size="8">shuffle.partitions=8</text>
  <text x="482" y="210" text-anchor="middle" fill="#2E6DA4" font-size="8" font-weight="bold">~10M+ registros</text>

